<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shoes Store</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <nav class="navbar py-3">
    <div class="container">
      <a class="navbar-brand fw-bold text-dark" href="index.html">SHOES.</a>
      <div class="navbar-nav flex-row gap-3">
        <a class="nav-link text-dark" href="#">Home</a>
        <a class="nav-link text-dark" href="#">Products</a>
        <a class="nav-link text-dark" href="#">About</a>
      </div>
    </div>
  </nav>

  <div class="container my-auto d-flex justify-content-center align-items-center">
    <div id="productCard" class="card p-4 shadow-sm">
      <div class="row g-4 align-items-center">
        
        <div class="col-md-6">
          <div class="img-container d-flex justify-content-center align-items-center">
            <img src="https://nmp.about.nike.com/about/prod/e3e7e739-589f-4821-893e-0674b9b3a7df/nike-pegasus-42-1.jpg?m=eyJlZGl0cyI6eyJqcGVnIjp7InF1YWxpdHkiOjEwMH0sIndlYnAiOnsicXVhbGl0eSI6MTAwfSwiZXh0cmFjdCI6eyJsZWZ0IjowLCJ0b3AiOjAsIndpZHRoIjoyNTYwLCJoZWlnaHQiOjMyMDB9LCJyZXNpemUiOnsid2lkdGgiOjM4NDB9fX0%3D&s=53fc561b63f75fc5e87b8ebdd9ed8be4b3e12908ba8a4a307c307185f9ee5cc5" class="img-fluid rounded" alt="Air Runner">
          </div>
        </div>

        <div class="col-md-6">
          <span class="text-category text-uppercase fw-bold">RUNNING SHOES</span>
          <h2 class="fw-bold my-1 text-dark">Air Runner</h2>
          <p class="text-description">Sepatu ringan dan nyaman untuk digunakan saat berolahraga maupun aktivitas sehari-hari.</p>
          <h4 class="fw-bold text-dark mb-3">Rp 899.000</h4>
          
          <p class="mb-2 text-dark label-pilih">Pilih warna:</p>
          
          <div class="d-flex gap-2 mb-4">
            <span class="color-btn btn-black-option" onclick="changeColor('#DDDDDD')"></span>
            <span class="color-btn btn-blue-option" onclick="changeColor('#CFE2FF')"></span>
            <span class="color-btn btn-cream-option" onclick="changeColor('#F5E6CC')"></span>
          </div>

          <button class="btn btn-custom w-100 py-2 rounded-3">Add to Cart</button>
        </div>

      </div>
    </div>
  </div>

    <script>
        function changeColor(color) {
        document.getElementById('productCard').style.backgroundColor = color;
        }
    </script>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
</html>
